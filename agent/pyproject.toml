[project]
name = "kyverno-agent"
version = "0.1.0"
description = "Kyverno policy generator agent with A2A protocol support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=0.2.4",
    "langgraph>=1.1.6",
    "langchain-openai>=0.3",
    "arize-phoenix-otel>=0.15",
    "openinference-instrumentation-langchain>=0.1.62",
    "openinference-instrumentation-openai>=0.1.44",
    "kubernetes>=31.0",
    "uvicorn>=0.32",
]

[project.scripts]
kyverno-agent = "main:main"
