apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kyverno-agent.fullname" . }}
  labels:
    app: {{ include "kyverno-agent.fullname" . }}
rules:
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies", "policies"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kyverno-agent.fullname" . }}
  labels:
    app: {{ include "kyverno-agent.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kyverno-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kyverno-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
