---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 1h
  url: https://kyverno.github.io/kyverno/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  targetNamespace: kyverno
  interval: 5m
  releaseName: kyverno
  install:
    createNamespace: true
  chart:
    spec:
      chart: kyverno
      version: "3.2.*"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
  values:
    admissionController:
      replicas: 1
    backgroundController:
      enabled: true
    cleanupController:
      enabled: true
    reportsController:
      enabled: true
