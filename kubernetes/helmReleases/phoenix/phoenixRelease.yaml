---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: phoenix
  namespace: phoenix
spec:
  type: oci
  interval: 1h
  url: oci://registry-1.docker.io/arizephoenix/phoenix-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: phoenix
  namespace: phoenix
spec:
  targetNamespace: phoenix
  interval: 5m
  releaseName: phoenix
  install:
    createNamespace: true
  chart:
    spec:
      chart: phoenix
      version: "0.7"
      sourceRef:
        kind: HelmRepository
        name: phoenix
        namespace: phoenix