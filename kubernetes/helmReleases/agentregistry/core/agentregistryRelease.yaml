---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: agentregistry-inventory
  namespace: agentregistry
spec:
  interval: 5m
  url: https://github.com/den-vasyliev/agentregistry-inventory
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentregistry-crds
  namespace: agentregistry
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: agentregistry-inventory
    namespace: agentregistry
  path: ./config/crd
  prune: false
  wait: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentregistry-inventory
  namespace: agentregistry
spec:
  targetNamespace: agentregistry
  interval: 5m
  releaseName: agentregistry-inventory
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./charts/agentregistry
      sourceRef:
        kind: GitRepository
        name: agentregistry-inventory
        namespace: agentregistry
